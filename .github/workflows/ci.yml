name: CI

on:
  push:
  pull_request:

jobs:
  # 엔진은 대상 저장소의 devDependency로 돌아간다 — 지원 범위(engines: >=18) 전체에서 통과해야 한다.
  # 특히 test/run.js가 파일을 직접 열거하는 이유가 Node 18/20/22 간 글로브·디렉터리 인자 처리 차이라서,
  # 그 회귀는 버전 매트릭스가 없으면 잡히지 않는다. Windows는 taskkill 프로세스 트리 종료,
  # LOCALAPPDATA codex 런처 탐색, .cmd 실행 파일 해석 경로가 있어 별도로 돌린다. 반대로 POSIX에는
  # 프로세스 그룹 종료 경로가 있어 ubuntu 쪽에서만 검증된다 — v0.3.1의 회귀를 잡은 것이 이 매트릭스다.
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['18', '20', '22', '24']
        include:
          - os: windows-latest
            node: '20'
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # package.json이 버전의 단일 소스다. README·SKILL.md·템플릿·plugin.json이 어긋난 채 병합되면
  # 설치 안내가 존재하지 않는 버전을 가리키게 된다.
  version:
    name: version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run version:check
